openapi: 3.0.0
info:
  title: Restaurant API
  description: RESTful API для веб-сайта организации деятельности ресторана
  version: 1.0.0
servers:
  - url: http://localhost:5000
paths:
  /api/menu:
    get:
      summary: Получить меню
      responses:
        '200':
          description: OK
  /api/tables:
    get:
      summary: Список столиков
      responses:
        '200':
          description: OK
  /api/orders:
    post:
      summary: Создать заказ
      responses:
        '201':
          description: Created
    get:
      summary: Список активных заказов
      responses:
        '200':
          description: OK
  /api/orders/{id}/items:
    post:
      summary: Добавить позицию в заказ
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
  /api/orders/{id}/pay:
    post:
      summary: Оплатить заказ
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
  /api/reservations:
    get:
      summary: Список бронирований
      responses:
        '200':
          description: OK
    post:
      summary: Создать бронирование
      responses:
        '201':
          description: Created
  /api/reports/revenue:
    get:
      summary: Отчёт по выручке (Reports микросервис)
      responses:
        '200':
          description: OK
  /api/reports/popular-dishes:
    get:
      summary: Популярные блюда (Reports микросервис)
      responses:
        '200':
          description: OK
